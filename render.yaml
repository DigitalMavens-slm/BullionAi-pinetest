# Render Blueprint — BullionAI backend + daily Shoonya session check
# PostgreSQL is hosted externally on Neon.
# Deploy changes through GitHub.

services:
  # ---------------------------------------------------------
  # BullionAI API
  # ---------------------------------------------------------
  - type: web
    name: bullionai-api
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node src/server/bullionai-api.js

    envVars:
      - key: PORT
        value: "8787"

      - key: NODE_ENV
        value: production

      # Neon PostgreSQL
      - key: DATABASE_URL
        sync: false

      # Shoonya
      - key: SHOONYA_CLIENT_ID
        value: FN215549_U

      - key: SHOONYA_SECRET_CODE
        sync: false

      - key: SHOONYA_REDIRECT_URL
        value: https://bullionai.in/

      # Whitelist the backend egress IP in the Shoonya portal. Without this the
      # API service calls Shoonya from an unapproved IP and gets INVALID_IP
      # errors, dropping the live feed. Must be set on the WEB service too
      # (it was previously only on the cron service).
      - key: SHOONYA_WHITELISTED_IP
        value: 74.220.49.7

      - key: SHOONYA_EXCHANGE
        value: MCX

      - key: SHOONYA_GOLD_SYMBOL
        value: GOLD05OCT26

      - key: SHOONYA_GOLD_TOKEN
        value: "483079"

      - key: SHOONYA_TOKEN
        value: "483079"

      - key: SHOONYA_SILVER_SYMBOL
        value: SILVER04SEP26

      - key: SHOONYA_SILVER_TOKEN
        value: "471725"

      # Admin
      - key: ADMIN_EMAILS
        value: sheriff.sheikh12@gmail.com

      # Backend URL
      - key: BACKEND_URL
        value: https://bullionai-pinetest.onrender.com

      # SendGrid
      - key: SENDGRID_FROM
        value: support@bullionai.in

      - key: SENDGRID_TO
        value: sheriff.sheikh12@gmail.com

      - key: SENDGRID_API_KEY
        sync: false

    autoDeploy: true

  # ---------------------------------------------------------
  # Daily Shoonya session check
  # ---------------------------------------------------------
  - type: cron
    name: bullionai-session-check
    runtime: node
    plan: free
    schedule: "20 3 * * 1-5"

    buildCommand: npm ci --omit=dev
    startCommand: node scripts/check-session.js

    envVars:
      - key: BACKEND_URL
        value: https://bullionai-pinetest.onrender.com

      # Shoonya whitelist
      - key: SHOONYA_WHITELISTED_IP
        value: 74.220.49.7

      # SendGrid
      - key: SENDGRID_FROM
        value: support@bullionai.in

      - key: SENDGRID_TO
        value: sheriff.sheikh12@gmail.com

      - key: SENDGRID_API_KEY
        sync: false

      # Optional webhook alerts
      - key: ALERT_WEBHOOK_URL
        sync: false

      - key: ALERT_WEBHOOK_TOKEN
        sync: false
